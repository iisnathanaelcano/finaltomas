    <script>
       const API_HP = 'https://hp-api.onrender.com/api/characters'; 
       const API_RICK = 'https://rickandmortyapi.com/api/character';
       
       const main = document.getElementById('main');
       const form = document.getElementById('form');
       const search = document.getElementById('search');

       getAllCharacters();
       async function getAllCharacters(){
        const [resRM, resHP] = await Promise.all([
        fetch(API_RICK).then(res => res.json()), 
        fetch(API_HP).then(res => res.json())
    ]);

            
              const rm = resRM.results || [];
              const hp = resHP || [];
            
        showCharacters([...rm, ...hp]);
       }
            function showCharacters(characters){
        main.innerHTML = '';

        characters.forEach((char) => {
       let name = char.name || 'Desconocida';
       let image = char.image || '';
       let status = char.status || (char.alive === false ? 'deceased' : 'alive' );
       let species = char.species || 'Desconocida';
       let location =char.location || '';
       let gender = char.gender || 'Desconocida';
       let house = char.house || '';
    

       const charElement = document.createElement('div');
       charElement.classList.add ('personaje');
     if (char.status) {
      let id = char.id;
      let status = char.status;

      

      charElement.innerHTML = `
        <img src="${image}" alt="${image}">
        <div class="personaje-info">
            <h3>${name}</h3>
            <br> ${gender}
        </div>
        <div class="overview">
            <h3>Descripción</h3>
            <p><strong>species:</strong> ${species}</p>
            <p><strong>gender:</strong> ${gender}</p>
            <p><strong>status:</strong> ${status}</p>
            <p><strong>location:</strong> ${location?.name ||'desconocido' }</p>
           
        </div>
      `;
    } else { const { house, patronus, yearOfBirth, ancestry } = char;
      

      charElement.innerHTML = `
        <img src="${image}" alt="${name}">
        <div class="personaje-info">
            <h3>${name}</h3>

        </div>
        <div class="overview">
            <h3>Descripción</h3>
            <p><strong>Especie:</strong> ${species}</p>
            <p><strong>Patronus:</strong> ${patronus || 'No posee'}</p>
            <p><strong>Año de nacimiento:</strong> ${yearOfBirth || 'Desconocido'}</p>
            <p><strong>Casa:</strong> ${house || 'no tiene'}</p>

        </div>
      `;
    }

    main.appendChild(charElement);
  });
}
  form.addEventListener('submit', (e) =>{
          e.preventDefault()
          const searchTerm = search.value.toLowerCase();
          if(searchTerm && searchTerm !== ''){
            getCharacters(API_RICK + `?name=${searchTerm}`);
            search.value='';
          }else{window.location.reload();}
        });
